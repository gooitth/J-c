<html lang="ar" dir="rtl">

<style>
:root{--bg:#f4f6f8;--card:#fff;--tx:#1b2430;--mu:#6b7785;--pr:#0f6b5c;--bd:#e1e6ea;--er:#c0392b;--ov:rgba(244,246,248,.9)}

:root[data-theme="dark"]{--bg:#11171c;--card:#1a232b;--tx:#e8edf1;--mu:#93a1ad;--bd:#2b3640;--pr:#2bb39b;--ov:rgba(17,23,28,.92)}
:root[data-theme="light"]{--bg:#f4f6f8;--card:#fff;--tx:#1b2430;--mu:#6b7785;--bd:#e1e6ea;--pr:#0f6b5c;--ov:rgba(244,246,248,.9)}
*{box-sizing:border-box;-webkit-print-color-adjust:exact;print-color-adjust:exact}
body{margin:0;background:linear-gradient(var(--ov),var(--ov)),url(bg.jpg) center/cover fixed,var(--bg);color:var(--tx);font-family:Tahoma,Arial,sans-serif;font-size:15px}
.wrap{max-width:900px;margin:0 auto;padding:12px}
.top{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;background:var(--card);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:5}
.top b{color:var(--pr)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin:10px 0}

.row{display:flex;gap:8px;flex-wrap:wrap;align-items:end}.row>*{flex:1;min-width:120px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.stat{background:var(--bg);border-radius:10px;padding:10px}.stat small{color:var(--mu);display:block}.stat b{font-size:19px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 0}.tabs button{white-space:nowrap}
.tbl{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:8px;border-bottom:1px solid var(--bd);text-align:right;white-space:nowrap}
.sub{border:1px dashed var(--bd);border-radius:8px;padding:8px;margin:6px 0}
.big{font-size:22px;font-weight:700;color:var(--pr)}.bad{color:var(--er)}.note{font-size:12px;color:var(--mu)}
#msg{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:10px;display:none;z-index:9;max-width:90%}

.vch{background:#fff;color:#000;border:2px solid #000;padding:16px;border-radius:6px;margin:10px 0}.vch h1{text-align:center;margin:6px 0 12px;font-size:22px}.vch .vh h2{text-align:center;margin:0}.vch table{width:100%;border-collapse:collapse}.vch td{border:1px solid #000;padding:10px;font-size:15px;white-space:normal;color:#000}.vch td:nth-child(odd){background:#f2f2f2;width:22%;font-weight:700}.vch table.lst td{background:#fff;width:auto;font-weight:400}.vch table.lst tr:first-child td{background:#f2f2f2;font-weight:700}.vch .boxes{display:flex;gap:12px;margin-top:18px}.vch .sig{flex:1;height:110px;border:1px solid #000;padding:6px}.vch .stamp{flex:2;height:150px;border:1px solid #000;padding:6px}
body{font-family:Cairo,Tahoma,Arial,sans-serif;-webkit-font-smoothing:antialiased}
#main{animation:fi .28s ease}@keyframes fi{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.card{border-radius:14px;box-shadow:0 1px 2px rgba(0,0,0,.04),0 8px 22px rgba(0,0,0,.05);transition:box-shadow .25s,transform .25s}
.card:hover{box-shadow:0 2px 4px rgba(0,0,0,.05),0 12px 28px rgba(0,0,0,.08)}
button{transition:transform .1s,filter .2s,opacity .2s;box-shadow:0 1px 2px rgba(0,0,0,.15);border-radius:10px}button:active{transform:scale(.96)}button:hover{filter:brightness(1.07)}
input,select,textarea{transition:border-color .2s,box-shadow .2s;border-radius:10px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--pr);box-shadow:0 0 0 3px rgba(15,107,92,.2)}
tbody tr:hover td,table tr:hover td{background:rgba(15,107,92,.06)}
.top{backdrop-filter:blur(8px);box-shadow:0 1px 10px rgba(0,0,0,.06)}
.tabs button{border-radius:20px;padding:8px 16px}
.spin{width:34px;height:34px;border:4px solid var(--bd);border-top-color:var(--pr);border-radius:50%;animation:sp .7s linear infinite;margin:50px auto}@keyframes sp{to{transform:rotate(360deg)}}
#thm{position:fixed;bottom:16px;left:16px;z-index:20;border-radius:50%;width:46px;height:46px;padding:0;font-size:21px;background:var(--card);color:var(--tx);border:1px solid var(--bd)}
.tabs button:hover{transform:translateY(-2px);box-shadow:0 4px 10px rgba(0,0,0,.15)}.stat{transition:transform .2s,box-shadow .2s}.stat:hover{transform:translateY(-3px);box-shadow:0 8px 18px rgba(0,0,0,.1)}.sub{transition:background .2s,transform .2s}.sub:hover{background:rgba(15,107,92,.07);transform:translateX(-3px)}th,td{transition:background .15s}button.d:hover{filter:brightness(1.12)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{:root,:root[data-theme]{--bg:#fff!important;--card:#fff!important;--tx:#000!important;--mu:#444!important;--bd:#bbb!important;--ov:transparent!important}#thm{display:none!important}.card{box-shadow:none!important}.top,.tabs,button,#msg{display:none!important}body{background:#fff;color:#000}.card{border:0}}
</style>

<script>
const URL_='https://lhedifqgdhhyskigqvlc.supabase.co',KEY_='sb_publishable_VJfcWCRA6TwAU6__ufyTPg_Nlm5lfpQ';
const SB=supabase.createClient(URL_,KEY_);
const $=s=>document.querySelector(s),$$=s=>document.querySelectorAll(s),app=$('#app');

async function fetchAll(t){let a=[],i=0;for(;;){const r=await SB.from(t).select('*').order('id').range(i,i+999);if(r.error)throw new Error(t+': '+r.error.message);a=a.concat(r.data);if(r.data.length<1000)break;i+=1000}return a}
async function attachTr(l,tr){let t;if(tr)t=tr;else{try{const m=(l||[]).reduce((a,x)=>Math.min(a,new Date(x.started_at).getTime()),Date.now());let a=[],i=0;for(;;){const r=await SB.from('box_transfers').select('from_box,to_box,amount,note,created_at').gte('created_at',new Date(m).toISOString()).order('created_at').range(i,i+999);if(r.error)throw r.error;a=a.concat(r.data);if(r.data.length<1000)break;i+=1000}t=a}catch(e){t=[]}}
 (l||[]).forEach(s=>{const a0=new Date(s.started_at),z=s.ended_at?new Date(s.ended_at):null;s.trs=s.box_id?t.filter(x=>(x.from_box==s.box_id||x.to_box==s.box_id)&&new Date(x.created_at)>=a0&&(!z||new Date(x.created_at)<=z)):[];s.net_tr=s.trs.reduce((q,x)=>q+(x.to_box==s.box_id?+x.amount:-x.amount),0)});return l}

async function init(){const{data:{session}}=await SB.auth.getSession();session?boot():loginUI()}
function loginUI(e=''){app.innerHTML=`<div class="wrap"><div class="card"><h2>🏦 مطابقة الصناديق</h2><label>اسم المستخدم</label><input id="un" autocapitalize="none" autocomplete="username"><label>كلمة المرور</label><div class="row"><input id="pw" type="password" autocomplete="current-password"><button class="s" style="flex:0" onclick="pw.type=pw.type=='password'?'text':'password'">👁</button></div><p class="bad">${e}</p><button onclick="login()">تسجيل الدخول</button></div></div>`;$('#pw').addEventListener('keydown',x=>{if(x.key=='Enter')login()})}
async function login(){const u=$('#un').value.trim().toLowerCase(),p=$('#pw').value;if(!u||!p)return;const{error}=await SB.auth.signInWithPassword({email:u+'@cashbox.example',password:p});error?loginUI((error.status==400?'اسم المستخدم أو كلمة المرور غير صحيحة':'خطأ: ')+' ['+(error.status||'')+'] '+esc(error.message)):boot()}
async function boot(){const{data:{session}}=await SB.auth.getSession();if(!session)return loginUI();const[{data:p},{data:c}]=await Promise.all([SB.from('profiles').select('*').eq('id',session.user.id).maybeSingle(),SB.from('settings').select('*').maybeSingle()]);
 if(!p||!p.active){await SB.auth.signOut();return loginUI('الحساب غير مفعل')}
 me=p;isAdm=p.role=='admin';if(c)cfg=c;shell()}
async function out(){await SB.auth.signOut();me=null;loginUI()}
function shell(){const T=[['home','الرئيسية'],['gshift','الشفت العام'],['shifts','الشفتات'],['cash','القاصة'],['refunds','الاسترجاعات'],['boxes','الصناديق'],['rep','التقرير حسب'],['daily','التقارير اليومية'],['bk','النسخ الاحتياطي'],['emps','الموظفون'],['audit','سجل التدقيق'],['set','الإعدادات']];
 app.innerHTML=`<div class="top"><b>🏦 ${esc(cfg.org_name)}</b><span>${esc(me.full_name)} <button class="s" onclick="out()">خروج</button></span></div><div class="wrap">${isAdm?`<div class="tabs">${T.map(t=>`<button class="${tab==t[0]?'':'s'}" onclick="tab='${t[0]}';shell()">${t[1]}</button>`).join('')}</div>`:''}<div id="main"><div class="spin"></div></div></div>`;
 isAdm?({home:aHome,gshift:aGShift,shifts:aShifts,cash:aCash,refunds:aRefunds,boxes:aBoxes,rep:aRep,daily:aDaily,emps:aEmps,set:aSet,audit:aAudit,bk:aBk}[tab]||aHome)():eHome()}

 if(error)return toast(error.message);await attachTr(sh);window._sh=sh;window._bo=bo||[];const op=sh.find(s=>s.status=='open');if(op){S=op;return form()}
 $('#main').innerHTML=`<div class="card"><h2>شفت جديد</h2><label>نوع الشفت</label><select id="ty"><option value="morning">صباحي</option><option value="evening">مسائي</option><option value="night">ليلي</option></select><label>الصندوق</label><select id="bx" onchange="prev()"><option value="">اختر الصندوق</option>${(window._bo||[]).map(b=>`<option value="${b.id}" ${b.busy?'disabled':''}>${esc(bn(b))}${b.busy?' (مستخدم)':''}</option>`).join('')}</select><p>رصيد الصندوق بالنظام: <b id="pv">—</b></p><label>النقد المستلم فعلياً بداية الشفت</label><input id="op" type="number" min="0" inputmode="decimal"><p class="note">${cfg.opening_mode=='manual'?'أدخل المبلغ الذي استلمته.':'يظهر رصيد الصندوق تلقائياً؛ غيّره إذا استلمت مبلغاً مختلفاً، فيُسجَّل الفرق ويتعدل رصيد الصندوق.'}</p><br><br><button id="sb" onclick="start()">حفظ وبدء الشفت</button></div>
 ${me.can_view_history?`<div class="card"><h2>سجل مبيعاتي</h2><div class="row"><div><label>طباعة تقريري حسب اليوم</label><input type="date" id="myd" value="${day(Date.now())}"></div><button style="flex:0" onclick="myDay()">طباعة</button></div>${sh.slice(0,30).map(s=>`<div class="sub row"><span>#${s.shift_no} — ${ST[s.shift_type]} — ${dt(s.started_at)} — ${fmt(tot(s).sold)}</span><button class="s" style="flex:0" onclick="printRow('${s.id}')">طباعة</button></div>`).join('')||'<p class="note">لا توجد شفتات</p>'}</div>`:''}`}

async function start(){const bx=$('#bx').value;if(!bx)return toast('اختر الصندوق');const ov=$('#op').value;if(ov===''||+ov<0)return toast('أدخل النقد المستلم');if(window._pvv!=null&&+ov!==window._pvv&&!confirm('رصيد الصندوق بالنظام '+fmt(window._pvv)+' وأنت أدخلت '+fmt(+ov)+'.\nسيُسجَّل الفرق ('+fmt(+ov-window._pvv)+') ويتعدل رصيد الصندوق. متابعة؟'))return;$('#sb').disabled=true;const{data:ns,error}=await SB.from('shifts').insert(Object.assign({employee_id:me.id,shift_type:$('#ty').value,box_id:+bx},{opening_cash:+ov})).select('opening_cash').single();if(error){toast(error.message);$('#sb').disabled=false}else{if(ns&&+ns.opening_cash!==+ov)alert('تنبيه: أدخلت '+ov+' لكن النظام سجّل '+ns.opening_cash+'. الإدخال اليدوي غير مفعّل بقاعدة البيانات، أبلغ المدير.');eHome()}}

 const num=(k,l)=>`<label>${l}</label><input type="number" min="0" inputmode="decimal" value="${S[k]??''}" ${d} oninput="S['${k}']=this.value===''?null:+this.value;calc()">`;
 $('#main').innerHTML=`<div class="card"><h2>${isAdm?'تعديل':'شفت'} — صندوق ${esc(S.box_no||S.shift_no)} — ${ST[S.shift_type]}</h2><p class="note">${esc(S.profiles?.full_name||me.full_name)} — بدأ ${dt(S.started_at)}${S.ended_at?' — انتهى '+dt(S.ended_at):''}</p>${isAdm?num('opening_cash','النقد المستلم بداية الشفت'):'<p>المستلم بداية الشفت: <b>'+fmt(S.opening_cash)+'</b>'+(S.opening_manual?' <span class="note">(يدوي، رصيد النظام '+fmt(S.opening_auto)+')</span>':'')+'</p>'}${num('boosted_cash','النقد المعزز')}</div>
 ${isAdm?`<div class="card"><h2>⚙️ بيانات الشفت (إدارية)</h2><div class="row"><div><label>الموظف</label><select onchange="S.employee_id=this.value">${(window._pf||[]).map(u=>`<option value="${u.id}" ${u.id==S.employee_id?'selected':''}>${esc(u.full_name)}</option>`).join('')}</select></div><div><label>نوع الشفت</label><select onchange="S.shift_type=this.value">${Object.entries(ST).map(([k,v])=>`<option value="${k}" ${S.shift_type==k?'selected':''}>${v}</option>`).join('')}</select></div></div><div class="row"><div><label>الصندوق</label><select onchange="S.box_id=+this.value||null"><option value="">بدون</option>${(window._bx2||[]).map(b=>`<option value="${b.id}" ${S.box_id==b.id?'selected':''}>${esc(bn(b))}</option>`).join('')}</select></div><div><label>سعر المعاملة</label><input type="number" min="0" value="${S.unit_price}" oninput="S.unit_price=+this.value;calc()"></div></div><div class="row"><div><label>بداية الشفت</label><input type="datetime-local" value="${loc(S.started_at)}" onchange="if(this.value)S.started_at=new Date(this.value).toISOString()"></div><div><label>نهاية الشفت</label><input type="datetime-local" value="${loc(S.ended_at)}" onchange="S.ended_at=this.value?new Date(this.value).toISOString():null"></div></div><label>الحالة</label><select onchange="S.status=this.value"><option value="open" ${S.status=='open'?'selected':''}>مفتوح</option><option value="done" ${S.status=='done'?'selected':''}>منتهٍ</option></select></div>`:''}<div class="card"><h2>المعاملات المباعة</h2>${num('sold_count','عدد المعاملات')}<p>× ${fmt(S.unit_price)} = <b id="sd">${fmt((S.sold_count||0)*S.unit_price)}</b></p><label>هل يوجد معاملات مباعة متفرقة؟</label><select ${d} onchange="S.hasSc=this.value=='y';setL('scattered_sales',S.hasSc?Math.max(1,S.scattered_sales.length):0)"><option value="n">لا</option><option value="y" ${hs?'selected':''}>نعم</option></select>
 ${hs?`<label>عدد المعاملات المتفرقة</label><input id="c_scattered_sales" type="number" min="1" max="50" value="${sc.length||''}" ${d} oninput="setL('scattered_sales',+this.value)">${sc.map((x,i)=>`<div class="sub row"><input type="number" min="0" placeholder="السعر" value="${x.price??''}" ${d} oninput="S.scattered_sales[${i}].price=+this.value;calc()"><input placeholder="وصف (اختياري)" value="${esc(x.note)}" ${d} oninput="S.scattered_sales[${i}].note=this.value"></div>`).join('')}`:''}

async function loadShiftsAll(){let a=[],i=0;for(;;){const r=await SB.from('shifts').select(Q).order('started_at').range(i,i+499);if(r.error)throw new Error(r.error.message);a=a.concat(r.data);if(r.data.length<500)break;i+=500}return a}
const dd=s=>day(s.started_at),hR=a=>'<tr>'+a.map(x=>`<th>${x}</th>`).join('')+'</tr>',dR=a=>'<tr>'+a.map(x=>`<td>${x}</td>`).join('')+'</tr>';
const sumS=l=>({n:l.reduce((a,s)=>a+(+s.sold_count||0)+(s.scattered_sales||[]).length,0),v:l.reduce((a,s)=>a+tot(s).sold,0),u:l.reduce((a,s)=>a+(s.unsold||[]).length,0),b:l.reduce((a,s)=>a+(+s.boosted_cash||0),0)});
const lg=(l,k)=>l.filter(x=>x.kind==k).reduce((a,x)=>a+ +x.amount,0);
function daysOf(per,d){if(per=='day')return[d];const[y,m]=d.split('-').map(Number),n=new Date(y,m,0).getDate();return[...Array(n)].map((_,i)=>y+'-'+String(m).padStart(2,'0')+'-'+String(i+1).padStart(2,'0'))}
function cashRow(D,sh,led){const before=led.filter(x=>day(x.created_at)<D),dl_=led.filter(x=>day(x.created_at)==D),sd=sh.filter(s=>dd(s)==D);
 const openBal=lg(before,'in')-lg(before,'out')-sumS(sh.filter(s=>dd(s)<D)).v,inD=lg(dl_.filter(x=>!x.refund_id),'in'),refD=lg(dl_.filter(x=>x.refund_id),'in'),outD=lg(dl_,'out'),S1=sumS(sd);
 return{D,openBal,inD,outD,soldD:S1.v,boost:S1.b,refD,close:openBal+inD+refD-outD-S1.v,avail:openBal+inD-outD,sd,dl:dl_}}
function cashHtml(days,sh,led,one){let rows='',x0=null,x1=null,T={i:0,o:0,s:0,b:0,r:0};
 days.forEach(D=>{const x=cashRow(D,sh,led);if(!x0)x0=x;x1=x;if(x.inD||x.refD||x.outD||x.soldD||x.boost||one){rows+=dR([D,fmt(x.openBal),fmt(x.inD),fmt(x.outD),fmt(x.soldD),fmt(x.refD),fmt(x.soldD-x.refD),fmt(x.boost),fmt(x.close)]);T.i+=x.inD;T.r+=x.refD;T.o+=x.outD;T.s+=x.soldD;T.b+=x.boost}});
 let h=`<table>${hR(['اليوم','القاصة بداية اليوم','إضافات','سحوبات','المباع الكلي','الاسترجاعات (تنقص من المباع)','صافي المباع (المنصرف)','التعزيز','المتبقي بالقاصة'])}${rows||'<tr><td colspan=9>لا توجد حركة</td></tr>'}${hR(['الإجمالي',fmt(x0.openBal),fmt(T.i),fmt(T.o),fmt(T.s),fmt(T.r),fmt(T.s-T.r),fmt(T.b),fmt(x1.close)])}</table><p class="note">صافي المنصرف = المباع الكلي − الاسترجاعات، ويُنسب ليوم بداية الشفت. التعزيز معلومة ولا يدخل برصيد القاصة.</p>`;
 if(one){const x=x0;h+=`<h2>المنصرف حسب الشفت</h2><table>${hR(['الشفت','عدد المباع','المباع الكلي'])}${Object.entries(ST).map(([k,v])=>{const q=sumS(x.sd.filter(s=>s.shift_type==k));return dR([v,q.n,fmt(q.v)])}).join('')}</table><h2>حركات القاصة اليدوية</h2><table>${hR(['الوقت','النوع','المبلغ','ملاحظة'])}${x.dl.map(m=>dR([dt(m.created_at),m.refund_id?'استرجاع':m.kind=='in'?'إضافة':'سحب',fmt(m.amount),esc(m.note)])).join('')||'<tr><td colspan=4>لا توجد</td></tr>'}</table>`}
 return h}
function salesHtml(days,sh,one,rf){rf=rf||[];let rows='',T={n:0,v:0,u:0,r:0};
 days.forEach(D=>{const q=sumS(sh.filter(s=>dd(s)==D)),r=rf.filter(x=>day(x.created_at)==D).reduce((a,x)=>a+ +x.amount,0);if(q.n||q.v||q.u||r){rows+=dR([D,q.n,fmt(q.v),fmt(r),fmt(q.v-r),q.u]);T.n+=q.n;T.v+=q.v;T.u+=q.u;T.r+=r}});
 let h=`<table>${hR(['اليوم','عدد المعاملات المباعة','المباع الكلي','الاسترجاعات','صافي المباع (بعد الاسترجاع)','عدد غير المباعة (لا تدخل بالحساب)'])}${rows||'<tr><td colspan=6>لا توجد بيانات</td></tr>'}${hR(['الإجمالي',T.n,fmt(T.v),fmt(T.r),fmt(T.v-T.r),T.u])}</table>`;
 if(one)h+=`<h2>حسب الشفت</h2><table>${hR(['الشفت','عدد المباع','المباع الكلي','الاسترجاعات','الصافي','غير المباعة'])}${Object.entries(ST).map(([k,v])=>{const q=sumS(sh.filter(s=>dd(s)==days[0]&&s.shift_type==k)),r=rf.filter(x=>day(x.created_at)==days[0]&&x.shift_type==k).reduce((a,x)=>a+ +x.amount,0);return dR([v,q.n,fmt(q.v),fmt(r),fmt(q.v-r),q.u])}).join('')}</table>`;
 return h}
function shiftHtml(days,sh,led,st,rf){rf=rf||[];let h='';
 (st?[st]:Object.keys(ST)).forEach(k=>{let rows='',T={n:0,v:0,u:0,r:0};const mine=sh.filter(s=>s.shift_type==k);
  days.forEach(D=>{const x=cashRow(D,sh,led),q=sumS(mine.filter(s=>dd(s)==D)),r=rf.filter(y=>y.shift_type==k&&day(y.created_at)==D).reduce((a,y)=>a+ +y.amount,0);if(q.n||q.v||q.u||r){rows+=dR([D,fmt(x.avail),fmt(q.v),fmt(r),fmt(q.v-r),fmt(x.avail-(q.v-r)),q.n,q.u]);T.n+=q.n;T.v+=q.v;T.u+=q.u;T.r+=r}});
  const det=mine.filter(s=>days.includes(dd(s)));

 return h}

 let r=await SB.from('general_shifts').update({status:'done',notes}).eq('id',g.id).select().single();if(r.error)return alert(r.error.message);
 try{const q=await gsSnap(r.data);r=await SB.from('general_shifts').update(q.upd).eq('id',g.id).select().single();if(r.error)throw new Error(r.error.message);await aud('إنهاء شفت عام #'+r.data.gs_no);showGS(r.data,q.list)}catch(e){alert('تم إنهاء الشفت لكن فشل حساب التقرير: '+e.message+'\nاستخدم زر إعادة حساب من السجل.');aGShift()}}
async function gsRecalc(id){const g=window._gs.find(x=>x.id==id);try{const q=await gsSnap(g);const r=await SB.from('general_shifts').update(q.upd).eq('id',id).select().single();if(r.error)throw new Error(r.error.message);toast('تمت إعادة الحساب');showGS(r.data,q.list)}catch(e){alert(e.message)}}
async function gsDel(id){const g=window._gs.find(x=>x.id==id);if(!confirm('حذف '+gsName(g)+'؟'))return;const r=await SB.from('general_shifts').delete().eq('id',id);r.error?alert(r.error.message):(await aud('حذف شفت عام #'+g.gs_no),aGShift())}
function showGS(g,list){$('#main').innerHTML=`<div class="vch"><div class="vh"><h2>🏦 ${esc(cfg.org_name)}</h2><h1>تقرير الشفت العام</h1></div><table><tr><td>اسم الشفت</td><td>${esc(gsName(g))}</td><td>المدير</td><td>${esc(me.full_name)}</td></tr><tr><td>بداية الشفت</td><td>${dt(g.started_at)}</td><td>نهاية الشفت</td><td>${dt(g.ended_at)}</td></tr><tr><td>مبلغ القاصة</td><td colspan=3>${fmt(g.opening_cash)}${g.opening_manual?' (إدخال يدوي — التلقائي '+fmt(g.opening_auto)+')':''}</td></tr><tr><td>مبلغ المباع</td><td colspan=3>${fmt(g.sold_total)}</td></tr><tr><td>الاسترجاعات (تنقص من المباع)</td><td colspan=3>${fmt(g.refunds_total||0)}</td></tr><tr><td>صافي المباع</td><td colspan=3>${fmt(g.sold_total-(g.refunds_total||0))}</td></tr><tr><td>صافي القاصة</td><td colspan=3><b style="font-size:20px">${fmt(g.net_cash)}</b></td></tr><tr><td>عدد المباع</td><td>${g.sold_count}</td><td>عدد غير المباع (لا يدخل بالحسابات)</td><td>${g.unsold_count}</td></tr>${g.notes?`<tr><td>ملاحظات</td><td colspan=3>${esc(g.notes)}</td></tr>`:''}</table>${list?`<h3>الشفتات المحتسبة (${list.length})</h3><table class="lst"><tr><td>الموظف</td><td>الصندوق</td><td>المباع</td><td>عدد المباع</td></tr>${list.map(s=>`<tr><td>${esc(s.profiles?.full_name)}</td><td>${esc(s.box_no)}</td><td>${fmt(tot(s).sold)}</td><td>${(+s.sold_count||0)+s.scattered_sales.length}</td></tr>`).join('')}</table>`:''}</div><button onclick="tab='gshift';shell()">رجوع</button> <button class="s" onclick="print()">طباعة</button>`;if(list)setTimeout(print,400)}

function applyTheme(){let t='';try{t=localStorage.getItem('theme')||''}catch(e){}document.documentElement.dataset.theme=t;const b=$('#thm');if(b)b.textContent=t=='dark'?'🌙':t=='light'?'☀️':'🌓'}
function togTheme(){let t='';try{t=localStorage.getItem('theme')||''}catch(e){}const n=t==''?'light':t=='light'?'dark':'';try{n?localStorage.setItem('theme',n):localStorage.removeItem('theme')}catch(e){}applyTheme();toast(n=='dark'?'الوضع الداكن':n=='light'?'الوضع الفاتح':'تلقائي حسب الجهاز')}
applyTheme();

init();
</script>

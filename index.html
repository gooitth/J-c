<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>فحص تسجيل الدخول - G STORE</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: Tahoma, sans-serif; background: #f4f4f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .box { background: white; padding: 25px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); width: 350px; text-align: center; }
        input, button { width: 100%; padding: 10px; margin: 8px 0; box-sizing: border-box; }
        button { background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="box">
        <h3>اختبار الاتصال والدخول</h3>
        <input type="text" id="username" placeholder="اسم المستخدم (admin)" value="admin">
        <input type="password" id="password" placeholder="كلمة المرور (1234)" value="1234">
        <button onclick="testLogin()">فحص وتسجيل الدخول</button>
    </div>

<script>
    const SUPABASE_URL = 'https://etztnzuivagqxjahlyqa.supabase.co';
    const SUPABASE_KEY = 'Sb_publishable_rHRivMdg5__JBuOND0tCKg_CY1Z7sA0';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function testLogin() {
        let u = document.getElementById('username').value.trim();
        let p = document.getElementById('password').value.trim();

        alert('جاري الاتصال بقاعدة البيانات وفحص المستخدم: ' + u);

        // جلب كل البيانات من الجدول لنرى هل يتصل أصلاً أم لا
        let { data, error } = await supabase
            .from('users')
            .select('*');

        if (error) {
            alert('خطأ في الاتصال بقاعدة البيانات: ' + error.message);
            console.error(error);
            return;
        }

        if (!data || data.length === 0) {
            alert('الجدول فارغ تماماً! لا توجد أي بيانات بداخل جدول users.');
            return;
        }

        alert('تم الاتصال بنجاح! عدد المستخدمين بالجدول: ' + data.length);

        // نبحث يدوياً عن المستخدم وكلمة المرور
        let found = data.find(user => user.username === u && user.password === p);

        if (found) {
            alert('تم العثور على المستخدم بنجاح! الصلاحية هي: ' + found.role);
        } else {
            alert('فشل المطابقة! اسم المستخدم أو كلمة المرور غير مطابقة لما هو موجود في الجدول.');
        }
    }
</script>

</body>
</html>

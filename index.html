<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>مطابقة الصناديق</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--tx:#1b2430;--mu:#6b7785;--pr:#0f6b5c;--bd:#e1e6ea;--er:#c0392b}
@media(prefers-color-scheme:dark){:root{--bg:#11171c;--card:#1a232b;--tx:#e8edf1;--mu:#93a1ad;--bd:#2b3640;--pr:#2bb39b}}
*{box-sizing:border-box;-webkit-print-color-adjust:exact;print-color-adjust:exact}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Tahoma,Arial,sans-serif;font-size:15px}
.wrap{max-width:900px;margin:0 auto;padding:12px}
.top{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;background:var(--card);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:5}
.top b{color:var(--pr)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin:10px 0}
h2{margin:0 0 10px;font-size:17px}
label{display:block;font-size:13px;color:var(--mu);margin:8px 0 3px}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
button{font:inherit;padding:9px 14px;border:0;border-radius:8px;background:var(--pr);color:#fff;cursor:pointer;font-weight:600}
button.s{background:transparent;color:var(--pr);border:1px solid var(--pr)}button.d{background:var(--er)}button:disabled{opacity:.5}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:end}.row>*{flex:1;min-width:120px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.stat{background:var(--bg);border-radius:10px;padding:10px}.stat small{color:var(--mu);display:block}.stat b{font-size:19px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 0}.tabs button{white-space:nowrap}
.tbl{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:8px;border-bottom:1px solid var(--bd);text-align:right;white-space:nowrap}
.sub{border:1px dashed var(--bd);border-radius:8px;padding:8px;margin:6px 0}
.big{font-size:22px;font-weight:700;color:var(--pr)}.bad{color:var(--er)}.note{font-size:12px;color:var(--mu)}
#msg{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:10px;display:none;z-index:9;max-width:90%}
@media print{.top,.tabs,button,#msg{display:none!important}body{background:#fff;color:#000}.card{border:0}}
</style>
</head>
<body>
<div id="app"></div><div id="msg"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const URL_='https://lhedifqgdhhyskigqvlc.supabase.co',KEY_='sb_publishable_VJfcWCRA6TwAU6__ufyTPg_Nlm5lfpQ';
const SB=supabase.createClient(URL_,KEY_);
const $=s=>document.querySelector(s),$$=s=>document.querySelectorAll(s),app=$('#app');
const fmt=n=>'$'+(+n||0).toLocaleString('en-US'),
esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),
dt=t=>t?new Date(t).toLocaleString('ar-IQ',{timeZone:'Asia/Baghdad',dateStyle:'short',timeStyle:'short'}):'—',
day=t=>new Date(t).toLocaleDateString('en-CA',{timeZone:'Asia/Baghdad'}),
ST={morning:'صباحي',evening:'مسائي',night:'ليلي'},
Q='*,scattered_sales(*),unsold(*),profiles(full_name)',HL='background:#fff3a3;color:#000';
let me,cfg={sale_price:2000,diff_limit:0,cash_alert:0,org_name:'مطابقة الصناديق'},S,tab='home',isAdm=false;
function toast(t){const m=$('#msg');m.textContent=t;m.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>m.style.display='none',3500)}
const tot=s=>{const sold=(s.sold_count||0)*s.unit_price+(s.scattered_sales||[]).reduce((a,x)=>a+(+x.price||0),0);return{sold,exp:(+s.opening_cash||0)+(+s.boosted_cash||0)-sold}};
const hasDiff=s=>s.status=='done'&&s.actual_cash!=null&&Math.abs(s.actual_cash-tot(s).exp)>+cfg.diff_limit+.001,isDiff=s=>hasDiff(s)&&!s.highlight_off;
const aud=(a,d)=>SB.from('audit_log').insert({action:a,detail:d||''});
async function init(){const{data:{session}}=await SB.auth.getSession();session?boot():loginUI()}
function loginUI(e=''){app.innerHTML=`<div class="wrap"><div class="card"><h2>🏦 مطابقة الصناديق</h2><label>اسم المستخدم</label><input id="un" autocapitalize="none" autocomplete="username"><label>كلمة المرور</label><div class="row"><input id="pw" type="password" autocomplete="current-password"><button class="s" style="flex:0" onclick="pw.type=pw.type=='password'?'text':'password'">👁</button></div><p class="bad">${e}</p><button onclick="login()">تسجيل الدخول</button></div></div>`;$('#pw').addEventListener('keydown',x=>{if(x.key=='Enter')login()})}
async function login(){const u=$('#un').value.trim().toLowerCase(),p=$('#pw').value;if(!u||!p)return;const{error}=await SB.auth.signInWithPassword({email:u+'@cashbox.example',password:p});error?loginUI((error.status==400?'اسم المستخدم أو كلمة المرور غير صحيحة':'خطأ: ')+' ['+(error.status||'')+'] '+esc(error.message)):boot()}
async function boot(){const{data:{user}}=await SB.auth.getUser();const{data:p}=await SB.from('profiles').select('*').eq('id',user.id).maybeSingle();
 if(!p||!p.active){await SB.auth.signOut();return loginUI('الحساب غير مفعل')}
 me=p;isAdm=p.role=='admin';const{data:c}=await SB.from('settings').select('*').maybeSingle();if(c)cfg=c;shell()}
async function out(){await SB.auth.signOut();me=null;loginUI()}
function shell(){const T=[['home','الرئيسية'],['shifts','الشفتات'],['cash','القاصة'],['rep','تقارير'],['emps','الموظفون'],['set','الإعدادات']];
 app.innerHTML=`<div class="top"><b>🏦 ${esc(cfg.org_name)}</b><span>${esc(me.full_name)} <button class="s" onclick="out()">خروج</button></span></div><div class="wrap">${isAdm?`<div class="tabs">${T.map(t=>`<button class="${tab==t[0]?'':'s'}" onclick="tab='${t[0]}';shell()">${t[1]}</button>`).join('')}</div>`:''}<div id="main">...</div></div>`;
 isAdm?({home:aHome,shifts:aShifts,cash:aCash,rep:aRep,emps:aEmps,set:aSet}[tab]||aHome)():eHome()}
// ---- employee ----
async function eHome(){const{data:sh,error}=await SB.from('shifts').select(Q).eq('employee_id',me.id).order('started_at',{ascending:false}).limit(60);
 if(error)return toast(error.message);window._sh=sh;const op=sh.find(s=>s.status=='open');if(op){S=op;return form()}
 $('#main').innerHTML=`<div class="card"><h2>شفت جديد</h2><label>نوع الشفت</label><select id="ty"><option value="morning">صباحي</option><option value="evening">مسائي</option><option value="night">ليلي</option></select><label>النقد المستلم بداية الشفت</label><input id="op" type="number" min="0" inputmode="decimal"><br><br><button id="sb" onclick="start()">حفظ وبدء الشفت</button></div>
 ${me.can_view_history?`<div class="card"><h2>سجل مبيعاتي</h2><div class="row"><div><label>طباعة تقريري حسب اليوم</label><input type="date" id="myd" value="${day(Date.now())}"></div><button style="flex:0" onclick="myDay()">طباعة</button></div>${sh.slice(0,30).map(s=>`<div class="sub row"><span>#${s.shift_no} — ${ST[s.shift_type]} — ${dt(s.started_at)} — ${fmt(tot(s).sold)}</span><button class="s" style="flex:0" onclick="printRow('${s.id}')">طباعة</button></div>`).join('')||'<p class="note">لا توجد شفتات</p>'}</div>`:''}`}
async function start(){const o=$('#op').value;if(o===''||+o<0)return toast('أدخل المبلغ');$('#sb').disabled=true;const{error}=await SB.from('shifts').insert({employee_id:me.id,shift_type:$('#ty').value,opening_cash:+o});if(error){toast(error.message);$('#sb').disabled=false}else eHome()}
function myDay(){const d=$('#myd').value;showRep('تقريري ليوم '+d,esc(me.full_name),window._sh.filter(s=>day(s.started_at)==d).reverse())}
// ---- shift form ----
function form(){const m=tot(S),ro=!isAdm&&S.status!='open',d=ro?'disabled':'',sc=S.scattered_sales,un=S.unsold,hs=S.hasSc??S.scattered_sales.length>0;
 const num=(k,l)=>`<label>${l}</label><input type="number" min="0" inputmode="decimal" value="${S[k]??''}" ${d} oninput="S['${k}']=this.value===''?null:+this.value;calc()">`;
 $('#main').innerHTML=`<div class="card"><h2>${isAdm?'تعديل':'شفت'} #${S.shift_no} — ${ST[S.shift_type]}</h2><p class="note">${esc(S.profiles?.full_name||me.full_name)} — بدأ ${dt(S.started_at)}${S.ended_at?' — انتهى '+dt(S.ended_at):''}</p>${isAdm?num('opening_cash','النقد المستلم بداية الشفت'):'<p>المستلم بداية الشفت: <b>'+fmt(S.opening_cash)+'</b></p>'}${num('boosted_cash','النقد المعزز')}</div>
 <div class="card"><h2>المعاملات المباعة</h2>${num('sold_count','عدد المعاملات')}<p>× ${fmt(S.unit_price)} = <b id="sd">${fmt((S.sold_count||0)*S.unit_price)}</b></p><label>هل يوجد معاملات مباعة متفرقة؟</label><select ${d} onchange="S.hasSc=this.value=='y';setL('scattered_sales',S.hasSc?Math.max(1,S.scattered_sales.length):0)"><option value="n">لا</option><option value="y" ${hs?'selected':''}>نعم</option></select>
 ${hs?`<label>عدد المعاملات المتفرقة</label><input id="c_scattered_sales" type="number" min="1" max="50" value="${sc.length||''}" ${d} oninput="setL('scattered_sales',+this.value)">${sc.map((x,i)=>`<div class="sub row"><input type="number" min="0" placeholder="السعر" value="${x.price??''}" ${d} oninput="S.scattered_sales[${i}].price=+this.value;calc()"><input placeholder="وصف (اختياري)" value="${esc(x.note)}" ${d} oninput="S.scattered_sales[${i}].note=this.value"></div>`).join('')}`:''}
 <p>المباع الكلي: <span class="big" id="tot">${fmt(m.sold)}</span></p></div>
 <div class="card"><h2>المعاملات غير المباعة</h2><label>عددها</label><input id="c_unsold" type="number" min="0" max="50" value="${un.length||''}" ${d} oninput="setL('unsold',+this.value)">${un.map((x,i)=>`<div class="sub row"><input placeholder="الاسم" value="${esc(x.customer)}" ${d} oninput="S.unsold[${i}].customer=this.value"><input type="number" min="0" placeholder="السعر" value="${x.price??''}" ${d} oninput="S.unsold[${i}].price=+this.value"></div>`).join('')}<p class="note">لا تدخل في المباع ولا في القاصة. (إرفاق الملفات: الخطوة القادمة)</p></div>
 <div class="card"><h2>نقد الصندوق</h2><p>المتوقع نهاية الشفت: <span class="big" id="exp">${fmt(m.exp)}</span></p>${num('actual_cash','نقد الصندوق نهاية الشفت')}<p id="df"></p><label>تم تسليم الشفت إلى</label><input value="${esc(S.handed_to)}" ${d} oninput="S.handed_to=this.value"><label>ملاحظات (اختياري)</label><textarea rows="3" ${d} oninput="S.notes=this.value">${esc(S.notes)}</textarea><br><br>
 ${ro?'':isAdm?`<button onclick="save('edit')">حفظ التعديل</button> <button class="s" onclick="printSheet()">طباعة</button> <button class="s" onclick="tab='shifts';shell()">رجوع</button>`:`<button class="s" onclick="save('draft')">حفظ</button> <button onclick="save('end')">حفظ وإنهاء الشفت</button>`}</div>`;calc()}
function setL(k,n){n=Math.max(0,Math.min(50,n||0));S[k].length=n;for(let i=0;i<n;i++)S[k][i]=S[k][i]||{price:0};form();const e=$('#c_'+k);if(e)e.focus()}
function calc(){const m=tot(S);$('#tot').textContent=fmt(m.sold);$('#sd').textContent=fmt((S.sold_count||0)*S.unit_price);$('#exp').textContent=fmt(m.exp);
 $('#df').innerHTML=S.actual_cash!=null?`الفرق: <b class="${Math.abs(S.actual_cash-m.exp)>.001?'bad':''}">${fmt(S.actual_cash-m.exp)}</b>`:''}
async function save(mode){
 if(mode=='end'){if(S.actual_cash==null)return toast('أدخل نقد الصندوق نهاية الشفت');if(S.unsold.some(u=>!u.customer))return toast('أدخل اسم كل زبون');if(!confirm('إنهاء الشفت؟ لن تتمكن من تعديله بعد ذلك.'))return}
 $$('button').forEach(b=>b.disabled=true);
 try{for(const k of['scattered_sales','unsold']){let r=await SB.from(k).delete().eq('shift_id',S.id);if(r.error)throw r.error;
   if(S[k].length){r=await SB.from(k).insert(S[k].map(x=>k=='unsold'?{shift_id:S.id,customer:x.customer||'',price:+x.price||0}:{shift_id:S.id,price:+x.price||0,note:x.note||null}));if(r.error)throw r.error}}
  const u={boosted_cash:S.boosted_cash||0,sold_count:S.sold_count||0,actual_cash:S.actual_cash,handed_to:S.handed_to||null,notes:S.notes||null};
  if(isAdm)u.opening_cash=S.opening_cash;if(mode=='end')u.status='done';
  const r=await SB.from('shifts').update(u).eq('id',S.id).select(Q).single();if(r.error)throw r.error;
  if(isAdm)await aud('تعديل شفت #'+S.shift_no);S=r.data;
  if(mode=='end')return printSheet();toast('تم الحفظ');form()
 }catch(e){toast('فشل الحفظ: '+e.message);form()}}
function printRow(id){S=window._sh.find(x=>x.id==id);printSheet()}
function printSheet(){const m=tot(S),L=(a,b)=>`<tr><td><b>${a}</b></td><td>${b}</td></tr>`,df=S.actual_cash!=null?S.actual_cash-m.exp:null;
 $('#main').innerHTML=`<div class="card"><h2>🏦 ${esc(cfg.org_name)} — ورقة الشفت #${S.shift_no}</h2><table>${L('الموظف',esc(S.profiles?.full_name||me.full_name))}${L('نوع الشفت',ST[S.shift_type])}${L('بدء الشفت',dt(S.started_at))}${L('نهاية الشفت',dt(S.ended_at))}${L('النقد المستلم بداية الشفت',fmt(S.opening_cash))}${L('النقد المعزز',fmt(S.boosted_cash))}${L('المعاملات المباعة',(S.sold_count||0)+' × '+fmt(S.unit_price)+' = '+fmt((S.sold_count||0)*S.unit_price))}${L('المباع المتفرق',S.scattered_sales.map(x=>fmt(x.price)+(x.note?' ('+esc(x.note)+')':'')).join('، ')||'لا يوجد')}${L('المباع الكلي',fmt(m.sold))}${L('غير المباعة',S.unsold.map(x=>esc(x.customer)+' — '+fmt(x.price)).join('<br>')||'لا يوجد')}${L('النقد المتوقع نهاية الشفت',fmt(m.exp))}${L('نقد الصندوق نهاية الشفت',S.actual_cash!=null?fmt(S.actual_cash):'—')}${L('الفرق',df==null?'—':isDiff(S)?`<mark style="background:#ffe44d;color:#000;padding:2px 8px">${fmt(df)}</mark>`:fmt(df))}${L('تم تسليم الشفت إلى',esc(S.handed_to)||'—')}${L('ملاحظات',esc(S.notes)||'—')}</table></div><button onclick="${isAdm?"tab='shifts'":"tab='home'"};shell()">رجوع</button> <button class="s" onclick="print()">طباعة</button>`;setTimeout(print,400)}
function showRep(title,sub,l){let T={o:0,b:0,t:0,e:0,a:0,d:0};
 const rows=l.map(s=>{const m=tot(s),df=s.actual_cash!=null?s.actual_cash-m.exp:null;T.o+=+s.opening_cash;T.b+=+s.boosted_cash;T.t+=m.sold;T.e+=m.exp;if(df!=null){T.a+=+s.actual_cash;T.d+=df}
  return`<tr style="${isDiff(s)?HL:''}"><td>${esc(s.profiles?.full_name)}</td><td>${ST[s.shift_type]}</td><td>${day(s.started_at)}</td><td>${fmt(s.opening_cash)}</td><td>${fmt(s.boosted_cash)}</td><td>${fmt(m.sold)}</td><td>${s.unsold.length}</td><td>${fmt(m.exp)}</td><td>${s.actual_cash!=null?fmt(s.actual_cash):'—'}</td><td>${df!=null?fmt(df):'—'}</td><td>${esc(s.handed_to)||'—'}</td></tr>`}).join('');
 $('#main').innerHTML=`<div class="card"><h2>🏦 ${esc(cfg.org_name)} — ${title}</h2><p class="note">${sub} — عدد الشفتات: ${l.length}</p><div class="tbl"><table><tr><th>الموظف</th><th>الشفت</th><th>التاريخ</th><th>مستلم</th><th>معزز</th><th>المباع</th><th>غير مباعة</th><th>المتوقع</th><th>النقد النهائي</th><th>الفرق</th><th>تسليم إلى</th></tr>${rows||'<tr><td colspan=11>لا توجد شفتات</td></tr>'}<tr><th colspan=3>الإجمالي</th><th>${fmt(T.o)}</th><th>${fmt(T.b)}</th><th>${fmt(T.t)}</th><th></th><th>${fmt(T.e)}</th><th>${fmt(T.a)}</th><th>${fmt(T.d)}</th><th></th></tr></table></div></div><button onclick="${isAdm?"tab='rep'":"tab='home'"};shell()">رجوع</button> <button class="s" onclick="print()">طباعة</button>`;setTimeout(print,400)}
// ---- admin ----
async function aHome(){const[{data:sh},{data:bal}]=await Promise.all([SB.from('shifts').select(Q).order('started_at',{ascending:false}).limit(200),SB.rpc('cash_balance')]);window._sh=sh||[];
 const td=day(Date.now()),St=(l,v)=>`<div class="stat"><small>${l}</small><b>${v}</b></div>`,dn=sh.filter(s=>s.status=='done');
 $('#main').innerHTML=`<div class="card"><h2>نظرة عامة</h2><div class="grid">${St('💰 رصيد القاصة',fmt(bal))}${St('شفتات اليوم',sh.filter(s=>day(s.started_at)==td).length)}${St('مفتوحة',sh.filter(s=>s.status=='open').length)}${St('منتهية',dn.length)}${St('قيمة المباع',fmt(dn.reduce((a,s)=>a+tot(s).sold,0)))}${St('شفتات فيها فرق',sh.filter(isDiff).length)}</div>${bal<+cfg.cash_alert?'<p class="bad">⚠️ رصيد القاصة أقل من حد التنبيه</p>':''}</div>
 <div class="card"><h2>🟢 شفتات مفتوحة الآن</h2>${sh.filter(s=>s.status=='open').map(s=>`<div class="sub">${esc(s.profiles?.full_name)} — ${ST[s.shift_type]} — منذ ${dt(s.started_at)}</div>`).join('')||'<p class="note">لا يوجد</p>'}</div>
 <div class="card"><h2>⚠️ آخر الفروقات</h2>${sh.filter(isDiff).slice(0,15).map(s=>`<div class="sub" style="${HL}">#${s.shift_no} ${esc(s.profiles?.full_name)} — ${day(s.started_at)} — الفرق <b class="bad">${fmt(s.actual_cash-tot(s).exp)}</b> <button class="s" onclick="printRow('${s.id}')">طباعة</button> <button class="s" onclick="togHl('${s.id}',true)">إزالة التظليل</button></div>`).join('')||'<p class="note">لا توجد فروقات</p>'}</div>`}
async function togHl(id,v){await SB.from('shifts').update({highlight_off:v}).eq('id',id);await aud('تظليل شفت',id);shell()}
let F={n:'',t:'',s:'',f:'',g:''};
async function aShifts(){const{data}=await SB.from('shifts').select(Q).order('started_at',{ascending:false}).limit(300);window._sh=data||[];dShifts()}
function dShifts(){const l=window._sh.filter(s=>(!F.n||(s.profiles?.full_name||'').includes(F.n))&&(!F.t||s.shift_type==F.t)&&(!F.s||s.status==F.s)&&(!F.f||day(s.started_at)>=F.f)&&(!F.g||day(s.started_at)<=F.g));
 $('#main').innerHTML=`<div class="card"><h2>الشفتات</h2><div class="row"><div><label>الموظف</label><input value="${esc(F.n)}" onchange="F.n=this.value;dShifts()"></div><div><label>النوع</label><select onchange="F.t=this.value;dShifts()"><option value="">الكل</option>${Object.entries(ST).map(([k,v])=>`<option value="${k}" ${F.t==k?'selected':''}>${v}</option>`).join('')}</select></div><div><label>الحالة</label><select onchange="F.s=this.value;dShifts()"><option value="">الكل</option><option value="open" ${F.s=='open'?'selected':''}>مفتوح</option><option value="done" ${F.s=='done'?'selected':''}>منتهٍ</option></select></div><div><label>من</label><input type="date" value="${F.f}" onchange="F.f=this.value;dShifts()"></div><div><label>إلى</label><input type="date" value="${F.g}" onchange="F.g=this.value;dShifts()"></div></div><br><button class="s" onclick="F={n:'',t:'',s:'',f:'',g:''};dShifts()">إعادة تعيين</button></div>
 <div class="card tbl"><table><tr><th>#</th><th>الموظف</th><th>النوع</th><th>البداية</th><th>المباع</th><th>المتوقع</th><th>الفعلي</th><th>الحالة</th><th></th></tr>${l.map(s=>{const m=tot(s);return`<tr style="${isDiff(s)?HL:''}"><td>${s.shift_no}</td><td>${esc(s.profiles?.full_name)}</td><td>${ST[s.shift_type]}</td><td>${dt(s.started_at)}</td><td>${fmt(m.sold)}</td><td>${fmt(m.exp)}</td><td>${s.actual_cash!=null?fmt(s.actual_cash):'—'}</td><td>${s.status=='open'?'مفتوح':'منتهٍ'}</td><td><button class="s" onclick="S=window._sh.find(x=>x.id=='${s.id}');form()">تعديل</button> <button class="s" onclick="printRow('${s.id}')">طباعة</button> ${hasDiff(s)?`<button class="s" onclick="togHl('${s.id}',${!s.highlight_off})">${s.highlight_off?'تفعيل التظليل':'إزالة التظليل'}</button> `:''}<button class="d" onclick="delShift('${s.id}')">حذف</button></td></tr>`}).join('')||'<tr><td colspan=9>لا توجد نتائج</td></tr>'}</table></div>`}
async function delShift(id){if(!confirm('حذف الشفت نهائياً؟'))return;const{error}=await SB.from('shifts').delete().eq('id',id);error?toast(error.message):(await aud('حذف شفت',id),aShifts())}
async function aCash(){const[{data:bal},{data:l}]=await Promise.all([SB.rpc('cash_balance'),SB.from('cash_ledger').select('*').order('created_at',{ascending:false}).limit(100)]);
 $('#main').innerHTML=`<div class="card"><h2>💰 القاصة</h2><p class="big">${fmt(bal)}</p><p class="note">مباع كل شفت منتهٍ يُخصم تلقائياً.</p><div class="row"><div><label>المبلغ</label><input id="ca" type="number" min="0"></div><div><label>ملاحظة</label><input id="cn"></div></div><br><button onclick="cashOp('in')">إضافة</button> <button class="d" onclick="cashOp('out')">سحب</button></div><div class="card tbl"><table><tr><th>الوقت</th><th>النوع</th><th>المبلغ</th><th>ملاحظة</th><th></th></tr>${l.map(x=>`<tr><td>${dt(x.created_at)}</td><td>${x.kind=='in'?'إضافة':'سحب'}</td><td>${fmt(x.amount)}</td><td style="white-space:normal">${esc(x.note)}</td><td><button class="d" onclick="cashDel('${x.id}')">حذف</button></td></tr>`).join('')||'<tr><td colspan=5>لا توجد حركات</td></tr>'}</table></div>`}
async function cashOp(k){const a=+$('#ca').value;if(!(a>0))return toast('أدخل مبلغاً صحيحاً');const{error}=await SB.from('cash_ledger').insert({kind:k,amount:a,note:$('#cn').value||null});error?toast(error.message):(await aud('حركة قاصة',k+' '+a),aCash())}
async function cashDel(id){if(!confirm('حذف الحركة؟'))return;await SB.from('cash_ledger').delete().eq('id',id);await aud('حذف حركة قاصة',id);aCash()}
async function aRep(){const t=day(Date.now()),{data:us}=await SB.from('profiles').select('id,full_name').order('full_name');
 $('#main').innerHTML=`<div class="card"><h2>📋 تقرير مختصر ليوم وشفت</h2><div class="row"><div><label>اليوم</label><input id="pd" type="date" value="${t}"></div><div><label>الشفت</label><select id="ps"><option value="">كل الشفتات</option>${Object.entries(ST).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></div></div><br><button onclick="repDay()">عرض وطباعة</button></div>
 <div class="card"><h2>👤 كشف موظف</h2><div class="row"><div><label>الموظف</label><select id="pe">${us.map(u=>`<option value="${u.id}">${esc(u.full_name)}</option>`).join('')}</select></div><div><label>من</label><input id="pf" type="date" value="${t}"></div><div><label>إلى</label><input id="pt" type="date" value="${t}"></div></div><br><button onclick="repEmp()">عرض وطباعة</button></div>`}
const all=async()=>(await SB.from('shifts').select(Q).order('started_at').limit(1000)).data||[];
async function repDay(){const d=$('#pd').value,t=$('#ps').value;showRep('تقرير يومي مختصر',d+' — '+(t?ST[t]:'كل الشفتات'),(await all()).filter(s=>day(s.started_at)==d&&(!t||s.shift_type==t)))}
async function repEmp(){const e=$('#pe').value,f=$('#pf').value,g=$('#pt').value;showRep('كشف الموظف: '+$('#pe').selectedOptions[0].text,f+' ← '+g,(await all()).filter(s=>s.employee_id==e&&day(s.started_at)>=f&&day(s.started_at)<=g))}
async function aEmps(){const{data:us}=await SB.from('profiles').select('*').order('created_at');window._us=us;
 $('#main').innerHTML=`<div class="card"><h2>إضافة موظف</h2><div class="row"><div><label>الاسم الكامل</label><input id="fn"></div><div><label>اسم المستخدم (إنجليزي)</label><input id="un" autocapitalize="none"></div><div><label>كلمة المرور (٦ أحرف+)</label><input id="pw" type="password"></div></div><br><button onclick="addEmp()">إضافة</button></div><div class="card tbl"><table><tr><th>الاسم</th><th>المستخدم</th><th>الدور</th><th>الحالة</th><th></th></tr>${us.map(u=>`<tr><td>${esc(u.full_name)}</td><td>${esc(u.username)}</td><td>${u.role=='admin'?'مدير':'موظف'}</td><td>${u.active?'فعال':'معطل'}</td><td>${u.id==me.id?'':`<button class="s" onclick="togEmp('${u.id}',${!u.active})">${u.active?'تعطيل':'تفعيل'}</button> <button class="s" onclick="togHist('${u.id}',${!u.can_view_history})">${u.can_view_history?'إخفاء السجل':'إظهار السجل'}</button> <button class="d" onclick="delEmp('${u.id}')">حذف</button>`}</td></tr>`).join('')}</table></div>`}
async function addEmp(){const fn=$('#fn').value.trim(),u=$('#un').value.trim().toLowerCase(),p=$('#pw').value;if(!fn||!/^[a-z0-9._-]+$/.test(u)||p.length<6)return toast('أكمل الحقول: اسم المستخدم حروف إنجليزية وأرقام، وكلمة المرور 6 أحرف+');
 const T=supabase.createClient(URL_,KEY_,{auth:{persistSession:false,autoRefreshToken:false,storageKey:'tmp'}});
 const{data,error}=await T.auth.signUp({email:u+'@cashbox.example',password:p});if(error||!data.user)return toast('تعذر الإنشاء: '+(error?.message||'اسم المستخدم مستخدم'));
 const r=await SB.from('profiles').insert({id:data.user.id,username:u,full_name:fn,role:'employee'});if(r.error)return toast(r.error.message);await aud('إضافة موظف',u);toast('تمت الإضافة');aEmps()}
async function delEmp(id){const u=window._us.find(x=>x.id==id);if(!confirm('حذف الموظف '+u.full_name+' نهائياً؟'))return;
 let r=await SB.rpc('admin_delete_user',{p_id:id,p_with_shifts:false});
 if(r.error&&r.error.message.includes('شفتات')){if(!confirm('لهذا الموظف شفتات مسجلة. الحذف سيمسح شفتاته أيضاً ويرجع مبالغها للقاصة. الأفضل التعطيل. هل تريد الحذف مع الشفتات؟'))return;r=await SB.rpc('admin_delete_user',{p_id:id,p_with_shifts:true})}
 r.error?toast(r.error.message):(toast('تم الحذف'),aEmps())}
async function togEmp(id,v){await SB.from('profiles').update({active:v}).eq('id',id);await aud('تغيير حالة حساب',id);aEmps()}
async function togHist(id,v){await SB.from('profiles').update({can_view_history:v}).eq('id',id);aEmps()}
function aSet(){$('#main').innerHTML=`<div class="card"><h2>الإعدادات</h2><label>اسم الجهة (يظهر في الطباعة)</label><input id="og" value="${esc(cfg.org_name)}"><label>سعر المعاملة المباعة (دولار)</label><input id="pr" type="number" min="0" value="${cfg.sale_price}"><label>حد الفرق المسموح قبل التنبيه</label><input id="dl" type="number" min="0" value="${cfg.diff_limit}"><label>حد تنبيه رصيد القاصة</label><input id="lw" type="number" min="0" value="${cfg.cash_alert}"><br><br><button onclick="saveSet()">حفظ</button></div>`}
async function saveSet(){const u={org_name:$('#og').value||'مطابقة الصناديق',sale_price:+$('#pr').value||0,diff_limit:+$('#dl').value||0,cash_alert:+$('#lw').value||0};const{error}=await SB.from('settings').update(u).eq('id',1);error?toast(error.message):(cfg={...cfg,...u},await aud('تعديل الإعدادات'),toast('تم الحفظ'))}
init();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">

<title>مطابقة الصناديق</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--tx:#1b2430;--mu:#6b7785;--pr:#0f6b5c;--bd:#e1e6ea;--er:#c0392b;--ov:rgba(244,246,248,.9)}
@media(prefers-color-scheme:dark){:root{--bg:#11171c;--card:#1a232b;--tx:#e8edf1;--mu:#93a1ad;--bd:#2b3640;--pr:#2bb39b;--ov:rgba(17,23,28,.92)}}
*{box-sizing:border-box;-webkit-print-color-adjust:exact;print-color-adjust:exact}
body{margin:0;background:linear-gradient(var(--ov),var(--ov)),url(bg.jpg) center/cover fixed,var(--bg);color:var(--tx);font-family:Tahoma,Arial,sans-serif;font-size:15px}
.wrap{max-width:900px;margin:0 auto;padding:12px}
.top{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;background:var(--card);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:5}
.top b{color:var(--pr)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin:10px 0}
h2{margin:0 0 10px;font-size:17px}
label{display:block;font-size:13px;color:var(--mu);margin:8px 0 3px}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
button{font:inherit;padding:9px 14px;border:0;border-radius:8px;background:var(--pr);color:#fff;cursor:pointer;font-weight:600}
button.s{background:transparent;color:var(--pr);border:1px solid var(--pr)}button.d{background:var(--er)}button:disabled{opacity:.5}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:end}.row>*{flex:1;min-width:120px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.stat{background:var(--bg);border-radius:10px;padding:10px}.stat small{color:var(--mu);display:block}.stat b{font-size:19px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 0}.tabs button{white-space:nowrap}
.tbl{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:8px;border-bottom:1px solid var(--bd);text-align:right;white-space:nowrap}
.sub{border:1px dashed var(--bd);border-radius:8px;padding:8px;margin:6px 0}
.big{font-size:22px;font-weight:700;color:var(--pr)}.bad{color:var(--er)}.note{font-size:12px;color:var(--mu)}
#msg{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:10px;display:none;z-index:9;max-width:90%}
@media print{.top,.tabs,button,#msg{display:none!important}body{background:#fff;color:#000}.card{border:0}}
</style>
</head>

async function fetchAll(t){let a=[],i=0;for(;;){const r=await SB.from(t).select('*').order('id').range(i,i+999);if(r.error)throw new Error(t+': '+r.error.message);a=a.concat(r.data);if(r.data.length<1000)break;i+=1000}return a}

async function init(){const{data:{session}}=await SB.auth.getSession();session?boot():loginUI()}

 if(!p||!p.active){await SB.auth.signOut();return loginUI('الحساب غير مفعل')}
 me=p;isAdm=p.role=='admin';const{data:c}=await SB.from('settings').select('*').maybeSingle();if(c)cfg=c;shell()}

function shell(){const T=[['home','الرئيسية'],['shifts','الشفتات'],['cash','القاصة'],['boxes','الصناديق'],['rep','التقرير حسب'],['bk','النسخ الاحتياطي'],['emps','الموظفون'],['audit','سجل التدقيق'],['set','الإعدادات']];
 app.innerHTML=`<div class="top"><b>🏦 ${esc(cfg.org_name)}</b><span>${esc(me.full_name)} <button class="s" onclick="out()">خروج</button></span></div><div class="wrap">${isAdm?`<div class="tabs">${T.map(t=>`<button class="${tab==t[0]?'':'s'}" onclick="tab='${t[0]}';shell()">${t[1]}</button>`).join('')}</div>`:''}<div id="main">...</div></div>`;
 isAdm?({home:aHome,shifts:aShifts,cash:aCash,boxes:aBoxes,rep:aRep,emps:aEmps,set:aSet,audit:aAudit,bk:aBk}[tab]||aHome)():eHome()}
// ---- employee ----
async function eHome(){const{data:sh,error}=await SB.from('shifts').select(Q).eq('employee_id',me.id).order('started_at',{ascending:false}).limit(60);
 if(error)return toast(error.message);await attachTr(sh);window._sh=sh;const{data:bo}=await SB.rpc('box_options');window._bo=bo||[];const op=sh.find(s=>s.status=='open');if(op){S=op;return form()}
 $('#main').innerHTML=`<div class="card"><h2>شفت جديد</h2><label>نوع الشفت</label><select id="ty"><option value="morning">صباحي</option><option value="evening">مسائي</option><option value="night">ليلي</option></select><label>الصندوق</label><select id="bx" onchange="prev()"><option value="">اختر الصندوق</option>${(window._bo||[]).map(b=>`<option value="${b.id}" ${b.busy?'disabled':''}>${esc(bn(b))}${b.busy?' (مستخدم)':''}</option>`).join('')}</select><p>رصيد الصندوق بالنظام: <b id="pv">—</b></p>${cfg.opening_mode=='manual'?'':`<label><input type="checkbox" id="mchk" style="width:auto" onchange="$('#mwrap').style.display=this.checked?'block':'none'"> المبلغ الذي استلمته مختلف (إدخال يدوي)</label>`}<div id="mwrap" style="display:${cfg.opening_mode=='manual'?'block':'none'}"><label>النقد المستلم فعلياً بداية الشفت</label><input id="op" type="number" min="0" inputmode="decimal"></div><br><br><button id="sb" onclick="start()">حفظ وبدء الشفت</button></div>
 ${me.can_view_history?`<div class="card"><h2>سجل مبيعاتي</h2><div class="row"><div><label>طباعة تقريري حسب اليوم</label><input type="date" id="myd" value="${day(Date.now())}"></div><button style="flex:0" onclick="myDay()">طباعة</button></div>${sh.slice(0,30).map(s=>`<div class="sub row"><span>#${s.shift_no} — ${ST[s.shift_type]} — ${dt(s.started_at)} — ${fmt(tot(s).sold)}</span><button class="s" style="flex:0" onclick="printRow('${s.id}')">طباعة</button></div>`).join('')||'<p class="note">لا توجد شفتات</p>'}</div>`:''}`}
async function prev(){const v=$('#bx').value;if(!v)return $('#pv').textContent='—';const r=await SB.rpc('box_preview',{p_id:+v});$('#pv').textContent=r.error?'—':fmt(r.data)}
async function empTransfer(){const a=+$('#ta').value,t=+$('#tt').value,n=$('#tn').value||null;if(!(a>0))return toast('أدخل مبلغاً صحيحاً');if(!confirm('تحويل '+fmt(a)+' من صندوقك؟'))return;await save('draft');const r=await SB.rpc('transfer_cash',{p_from:S.box_id,p_to:t,p_amount:a,p_note:n});toast(r.error?r.error.message:'تم التحويل');eHome()}
async function start(){const bx=$('#bx').value;if(!bx)return toast('اختر الصندوق');const man=cfg.opening_mode=='manual'||($('#mchk')&&$('#mchk').checked),ov=$('#op').value;if(man&&(ov===''||+ov<0))return toast('أدخل النقد المستلم');$('#sb').disabled=true;const{data:ns,error}=await SB.from('shifts').insert(Object.assign({employee_id:me.id,shift_type:$('#ty').value,box_id:+bx},man?{opening_cash:+ov}:{})).select('opening_cash').single();if(error){toast(error.message);$('#sb').disabled=false}else{if(man&&ns&&+ns.opening_cash!==+ov)alert('تنبيه: أدخلت '+ov+' لكن النظام سجّل '+ns.opening_cash+'. الإدخال اليدوي غير مفعّل بقاعدة البيانات، أبلغ المدير.');eHome()}}
function myDay(){const d=$('#myd').value;showRep('تقريري ليوم '+d,esc(me.full_name),window._sh.filter(s=>day(s.started_at)==d).reverse())}
// ---- shift form ----
function form(){const m=tot(S),ro=!isAdm&&S.status!='open',d=ro?'disabled':'',sc=S.scattered_sales,un=S.unsold,hs=S.hasSc??S.scattered_sales.length>0;
 const num=(k,l)=>`<label>${l}</label><input type="number" min="0" inputmode="decimal" value="${S[k]??''}" ${d} oninput="S['${k}']=this.value===''?null:+this.value;calc()">`;
 $('#main').innerHTML=`<div class="card"><h2>${isAdm?'تعديل':'شفت'} — صندوق ${esc(S.box_no||S.shift_no)} — ${ST[S.shift_type]}</h2><p class="note">${esc(S.profiles?.full_name||me.full_name)} — بدأ ${dt(S.started_at)}${S.ended_at?' — انتهى '+dt(S.ended_at):''}</p>${isAdm?num('opening_cash','النقد المستلم بداية الشفت'):'<p>المستلم بداية الشفت: <b>'+fmt(S.opening_cash)+'</b>'+(S.opening_manual?' <span class="note">(يدوي، رصيد النظام '+fmt(S.opening_auto)+')</span>':'')+'</p>'}${num('boosted_cash','النقد المعزز')}</div>
 <div class="card"><h2>المعاملات المباعة</h2>${num('sold_count','عدد المعاملات')}<p>× ${fmt(S.unit_price)} = <b id="sd">${fmt((S.sold_count||0)*S.unit_price)}</b></p><label>هل يوجد معاملات مباعة متفرقة؟</label><select ${d} onchange="S.hasSc=this.value=='y';setL('scattered_sales',S.hasSc?Math.max(1,S.scattered_sales.length):0)"><option value="n">لا</option><option value="y" ${hs?'selected':''}>نعم</option></select>
 ${hs?`<label>عدد المعاملات المتفرقة</label><input id="c_scattered_sales" type="number" min="1" max="50" value="${sc.length||''}" ${d} oninput="setL('scattered_sales',+this.value)">${sc.map((x,i)=>`<div class="sub row"><input type="number" min="0" placeholder="السعر" value="${x.price??''}" ${d} oninput="S.scattered_sales[${i}].price=+this.value;calc()"><input placeholder="وصف (اختياري)" value="${esc(x.note)}" ${d} oninput="S.scattered_sales[${i}].note=this.value"></div>`).join('')}`:''}
 <p>المباع الكلي: <span class="big" id="tot">${fmt(m.sold)}</span></p></div>
 <div class="card"><h2>المعاملات غير المباعة</h2><label>عددها</label><input id="c_unsold" type="number" min="0" max="50" value="${un.length||''}" ${d} oninput="setL('unsold',+this.value)">${un.map((x,i)=>`<div class="sub row"><input placeholder="الاسم" value="${esc(x.customer)}" ${d} oninput="S.unsold[${i}].customer=this.value"><input type="number" min="0" placeholder="السعر" value="${x.price??''}" ${d} oninput="S.unsold[${i}].price=+this.value"></div>`).join('')}<p class="note">لا تدخل في المباع ولا في القاصة. (إرفاق الملفات: الخطوة القادمة)</p></div>
 ${!isAdm&&S.status=='open'?`<div class="card"><h2>🔄 تحويل من صندوقي</h2><div class="row"><div><label>إلى صندوق</label><select id="tt">${(window._bo||[]).filter(b=>b.id!=S.box_id).map(b=>`<option value="${b.id}">${esc(bn(b))}</option>`).join('')}</select></div><div><label>المبلغ</label><input id="ta" type="number" min="0"></div></div><label>ملاحظة</label><input id="tn"><br><br><button class="s" onclick="empTransfer()">تحويل</button><p class="note">صافي التحويلات بهذا الشفت: <b>${fmt(S.net_tr||0)}</b></p></div>`:''}<div class="card"><h2>نقد الصندوق</h2><p>المتوقع نهاية الشفت: <span class="big" id="exp">${fmt(m.exp)}</span></p>${num('actual_cash','نقد الصندوق نهاية الشفت')}<p id="df"></p><label>تم تسليم الشفت إلى</label><input value="${esc(S.handed_to)}" ${d} oninput="S.handed_to=this.value"><label>ملاحظات (اختياري)</label><textarea rows="3" ${d} oninput="S.notes=this.value">${esc(S.notes)}</textarea><br><br>
 ${ro?'':isAdm?`<button onclick="save('edit')">حفظ التعديل</button> <button class="s" onclick="printSheet()">طباعة</button> ${S.status=='open'?'<button class="s" onclick="save(&quot;end&quot;)">إنهاء الشفت (إداري)</button>':'<button class="s" onclick="reopen()">إعادة فتح الشفت</button>'} <button class="s" onclick="tab='shifts';shell()">رجوع</button>`:`<button class="s" onclick="save('draft')">حفظ</button> <button onclick="save('end')">حفظ وإنهاء الشفت</button>`}</div>`;calc()}
function setL(k,n){n=Math.max(0,Math.min(50,n||0));S[k].length=n;for(let i=0;i<n;i++)S[k][i]=S[k][i]||{price:0};form();const e=$('#c_'+k);if(e)e.focus()}
function calc(){const m=tot(S);$('#tot').textContent=fmt(m.sold);$('#sd').textContent=fmt((S.sold_count||0)*S.unit_price);$('#exp').textContent=fmt(m.exp);
 $('#df').innerHTML=S.actual_cash!=null?`الفرق: <b class="${Math.abs(S.actual_cash-m.exp)>.001?'bad':''}">${fmt(S.actual_cash-m.exp)}</b>`:''}
async function save(mode){
 if(mode=='end'){if(S.actual_cash==null)return toast('أدخل نقد الصندوق نهاية الشفت');if(S.unsold.some(u=>!u.customer))return toast('أدخل اسم كل زبون');if(!confirm('إنهاء الشفت؟ لن تتمكن من تعديله بعد ذلك.'))return}
 $$('button').forEach(b=>b.disabled=true);
 try{for(const k of['scattered_sales','unsold']){let r=await SB.from(k).delete().eq('shift_id',S.id);if(r.error)throw r.error;
   if(S[k].length){r=await SB.from(k).insert(S[k].map(x=>k=='unsold'?{shift_id:S.id,customer:x.customer||'',price:+x.price||0}:{shift_id:S.id,price:+x.price||0,note:x.note||null}));if(r.error)throw r.error}}
  const u={boosted_cash:S.boosted_cash||0,sold_count:S.sold_count||0,actual_cash:S.actual_cash,handed_to:S.handed_to||null,notes:S.notes||null};
  const o0=(window._sh||[]).find(x=>x.id==S.id);if(isAdm){u.opening_cash=S.opening_cash;if(!o0||o0.opening_cash!=S.opening_cash)u.opening_manual=true}if(mode=='end')u.status='done';
  const r=await SB.from('shifts').update(u).eq('id',S.id).select(Q).single();if(r.error)throw r.error;
  if(isAdm)await aud('تعديل شفت #'+S.shift_no);r.data.net_tr=S.net_tr;S=r.data;
  if(mode=='end')return printSheet();toast('تم الحفظ');form()
 }catch(e){toast('فشل الحفظ: '+e.message);form()}}
function printRow(id){S=window._sh.find(x=>x.id==id);printSheet()}
function sheetHtml(S){const m=tot(S),L=(a,b)=>`<tr><td><b>${a}</b></td><td>${b}</td></tr>`,df=S.actual_cash!=null?S.actual_cash-m.exp:null;
 return`<h2>🏦 ${esc(cfg.org_name)} — ورقة الشفت — صندوق ${esc(S.box_no||S.shift_no)}</h2><table>${L('الموظف',esc(S.profiles?.full_name||me.full_name))}${L('نوع الشفت',ST[S.shift_type])}${L('بدء الشفت',dt(S.started_at))}${L('نهاية الشفت',dt(S.ended_at))}${L('النقد المستلم بداية الشفت',fmt(S.opening_cash))}${S.opening_manual?L('فرق الاستلام عن رصيد الصندوق',fmt(S.opening_cash-S.opening_auto)):''}${L('النقد المعزز',fmt(S.boosted_cash))}${L('المعاملات المباعة',(S.sold_count||0)+' × '+fmt(S.unit_price)+' = '+fmt((S.sold_count||0)*S.unit_price))}${L('المباع المتفرق',S.scattered_sales.map(x=>fmt(x.price)+(x.note?' ('+esc(x.note)+')':'')).join('، ')||'لا يوجد')}${L('المباع الكلي',fmt(m.sold))}${L('غير المباعة',S.unsold.map(x=>esc(x.customer)+' — '+fmt(x.price)).join('<br>')||'لا يوجد')}${L('صافي تحويلات الصناديق',fmt(S.net_tr||0))}${L('النقد المتوقع نهاية الشفت',fmt(m.exp))}${L('نقد الصندوق نهاية الشفت',S.actual_cash!=null?fmt(S.actual_cash):'—')}${L('الفرق',df==null?'—':isDiff(S)?`<mark style="background:#ffe44d;color:#000;padding:2px 8px">${fmt(df)}</mark>`:fmt(df))}${L('تم تسليم الشفت إلى',esc(S.handed_to)||'—')}${L('ملاحظات',esc(S.notes)||'—')}</table>`}
function printSheet(){$('#main').innerHTML=`<div class="card">${sheetHtml(S)}</div><button onclick="${isAdm?"tab='shifts'":"tab='home'"};shell()">رجوع</button> <button class="s" onclick="print()">طباعة</button>`;setTimeout(print,400)}
function sumT(l){const T={o:0,b:0,t:0,e:0,a:0,d:0};l.forEach(s=>{const m=tot(s);T.o+=+s.opening_cash||0;T.b+=+s.boosted_cash||0;T.t+=m.sold;T.e+=m.exp;if(s.actual_cash!=null){T.a+=+s.actual_cash;T.d+=s.actual_cash-m.exp}});return T}
const gk=(s,g)=>g=='emp'?(s.profiles?.full_name||'—'):g=='box'?('صندوق '+(s.box_no||'—')):g=='day'?day(s.started_at):'';

async function aAudit(){const[{data:l},{data:us}]=await Promise.all([SB.from('audit_log').select('*').order('at',{ascending:false}).limit(200),SB.from('profiles').select('id,full_name')]);const nm=Object.fromEntries(us.map(u=>[u.id,u.full_name]));
 $('#main').innerHTML=`<div class="card tbl"><h2>سجل التدقيق (آخر 200)</h2><table><tr><th>الوقت</th><th>المدير</th><th>العملية</th><th>التفاصيل</th></tr>${l.map(a=>`<tr><td>${dt(a.at)}</td><td>${esc(nm[a.actor]||'—')}</td><td>${esc(a.action)}</td><td style="white-space:normal">${esc(a.detail)}</td></tr>`).join('')||'<tr><td colspan=4>لا يوجد</td></tr>'}</table></div>`}

async function aBoxes(){const[{data:b},{data:op},{data:t}]=await Promise.all([SB.from('boxes').select('*').order('sort'),SB.from('shifts').select('box_id,profiles(full_name)').eq('status','open'),SB.from('box_transfers').select('*').order('created_at',{ascending:false}).limit(50)]);
 const nm=id=>{const x=b.find(y=>y.id==id);return x?bn(x):id},opt=b.map(x=>`<option value="${x.id}">${esc(bn(x))}</option>`).join('');
 $('#main').innerHTML=`<div class="card"><h2>📦 الصناديق</h2><p>مجموع النقد بالصناديق: <b class="big">${fmt(b.reduce((a,x)=>a+ +x.balance,0))}</b></p><div class="tbl"><table><tr><th>الصندوق</th><th>الرصيد</th><th>الحالة</th><th></th></tr>${b.map(x=>{const o=op.find(y=>y.box_id==x.id);return`<tr><td>${esc(bn(x))}</td><td>${fmt(x.balance)}</td><td>${o?'🟢 '+esc(o.profiles?.full_name):'فارغ'}</td><td><button class="s" onclick="editBox(${x.id})">تعديل الرصيد</button></td></tr>`}).join('')}</table></div></div>
 <div class="card"><h2>🔄 تحويل بين الصناديق</h2><div class="row"><div><label>من</label><select id="ff">${opt}</select></div><div><label>إلى</label><select id="ft">${opt}</select></div><div><label>المبلغ</label><input id="fa" type="number" min="0"></div></div><label>ملاحظة</label><input id="fn"><br><br><button onclick="admTransfer()">تحويل</button></div>
 <div class="card tbl"><h2>آخر التحويلات</h2><table><tr><th>الوقت</th><th>من</th><th>إلى</th><th>المبلغ</th><th>ملاحظة</th><th></th></tr>${t.map(x=>`<tr><td>${dt(x.created_at)}</td><td>${esc(nm(x.from_box))}</td><td>${esc(nm(x.to_box))}</td><td>${fmt(x.amount)}</td><td style="white-space:normal">${esc(x.note)}</td><td><button class="d" onclick="delTr('${x.id}')">حذف</button></td></tr>`).join('')||'<tr><td colspan=6>لا توجد تحويلات</td></tr>'}</table></div>`}
async function editBox(id){const{data:x}=await SB.from('boxes').select('*').eq('id',id).single(),v=prompt('الرصيد الجديد لـ '+bn(x),x.balance);if(v===null||isNaN(+v)||v==='')return;const r=await SB.rpc('admin_set_box',{p_id:id,p_value:+v});r.error?toast(r.error.message):(await aud('تعديل رصيد صندوق '+x.name,x.balance+' ← '+v),aBoxes())}
async function delTr(id){if(!confirm('حذف التحويل؟ الأرصدة والشفتات المرتبطة تتعدل تلقائياً.'))return;const r=await SB.from('box_transfers').delete().eq('id',id);r.error?toast(r.error.message):(await aud('حذف تحويل',id),aBoxes())}
async function admTransfer(){const a=+$('#fa').value,f=+$('#ff').value,t=+$('#ft').value;if(!(a>0)||f==t)return toast('تحقق من المبلغ واختلاف الصندوقين');const r=await SB.rpc('transfer_cash',{p_from:f,p_to:t,p_amount:a,p_note:$('#fn').value||null});r.error?toast(r.error.message):(toast('تم التحويل'),aBoxes())}

const BK=['profiles','settings','boxes','shifts','scattered_sales','unsold','box_transfers','box_events','cash_ledger','audit_log'];
async function mkBackup(){const o={v:2,app:'cashbox',at:new Date().toISOString()};for(const t of BK)o[t]=await fetchAll(t);return o}
function bkDue(){try{const l=+localStorage.getItem('lastBk')||0,d=+localStorage.getItem('bkDays')||10;return Date.now()-l>d*864e5}catch(e){return false}}
function setBd(v){try{localStorage.setItem('bkDays',Math.max(1,+v||10))}catch(e){}}
function aBk(){let l=0,d=10;try{l=+localStorage.getItem('lastBk')||0;d=+localStorage.getItem('bkDays')||10}catch(e){}
 $('#main').innerHTML=`<div class="card"><h2>💾 نسخة احتياطية كاملة</h2><p class="note">تشمل: الموظفين، الشفتات وتفاصيلها، الصناديق والتحويلات، القاصة، الإعدادات، سجل التدقيق. آخر نسخة من هذا الجهاز: ${l?dt(l):'لا توجد'}</p><button onclick="backup()">تنزيل نسخة كاملة</button><label>تذكير كل (أيام)</label><input type="number" min="1" value="${d}" onchange="setBd(this.value)"></div>
 <div class="card"><h2>📂 فتح نسخة (عرض فقط)</h2><p class="note">تتصفح الشفتات والتقارير بدون أي تغيير بالبيانات الحالية.</p><input type="file" accept=".json" onchange="viewBk(this.files[0])"></div>
 <div class="card"><h2>♻️ استعادة نسخة</h2><p class="note bad">تستبدل الشفتات والتحويلات والقاصة والصناديق الحالية بمحتوى النسخة. تُنزَّل نسخة أمان تلقائياً قبل الاستعادة. كلمات المرور وسجل التدقيق لا تتغير.</p><input type="file" accept=".json" onchange="restoreBk(this.files[0])"></div>`}
async function backup(){try{toast('جار تجهيز النسخة...');const o=await mkBackup();dl('backup-'+day(Date.now())+'.json',JSON.stringify(o),'application/json');try{localStorage.setItem('lastBk',Date.now())}catch(e){}await aud('تنزيل نسخة احتياطية');toast('تم تنزيل النسخة');aBk()}catch(e){toast('فشل: '+e.message)}}
async function readBk(f){let o;try{o=JSON.parse(await f.text())}catch(e){toast('ملف غير صالح');return null}if(!o||o.v!==2||!Array.isArray(o.shifts)){toast('الملف ليس نسخة صحيحة');return null}return o}
async function viewBk(f){if(!f)return;const o=await readBk(f);if(!o)return;const pm=Object.fromEntries((o.profiles||[]).map(x=>[x.id,x]));
 const l=o.shifts.map(s=>Object.assign({},s,{scattered_sales:(o.scattered_sales||[]).filter(x=>x.shift_id==s.id),unsold:(o.unsold||[]).filter(x=>x.shift_id==s.id),profiles:pm[s.employee_id]||{full_name:'(محذوف)'}})).sort((a,b)=>new Date(a.started_at)-new Date(b.started_at));
 await attachTr(l,o.box_transfers||[]);showRep('عرض نسخة احتياطية بتاريخ '+dt(o.at),'للقراءة فقط — '+l.length+' شفت',l,'',true)}
async function restoreBk(f){if(!f)return;const o=await readBk(f);if(!o)return;
 if(!confirm('سيتم استبدال البيانات الحالية بنسخة بتاريخ '+dt(o.at)+':\n'+o.shifts.length+' شفت، '+(o.box_transfers||[]).length+' تحويل، '+(o.cash_ledger||[]).length+' حركة قاصة.\nستُنزَّل نسخة أمان أولاً. متابعة؟'))return;
 try{const cur=await mkBackup();dl('safety-before-restore-'+day(Date.now())+'.json',JSON.stringify(cur),'application/json')}catch(e){return toast('تعذر أخذ نسخة الأمان: '+e.message)}
 const r=await SB.rpc('restore_backup',{p:o});if(r.error)return toast('فشلت الاستعادة: '+r.error.message);
 await aud('استعادة نسخة احتياطية',dt(o.at));alert('تمت الاستعادة: '+JSON.stringify(r.data));aBk()}

init();
</script>
</body>
